# バレットジャーナル(bujo/)だけを GitHub Pages で公開する
# リポジトリの Settings > Pages > Source を「GitHub Actions」にしてください
name: Deploy bujo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['bujo/**', '.github/workflows/deploy-bujo.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bujo
      - id: deployment
        uses: actions/deploy-pages@v4
